<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#080808" />
    <title>Raffaele Suppa</title>
    <script>
      (function () {
        const getSystemTheme = () =>
          window.matchMedia("(prefers-color-scheme: dark)").matches
            ? "dark"
            : "light";

        const getSavedTheme = () => {
          try {
            const saved = localStorage.getItem("theme");
            return ["dark", "auto"].includes(saved) ? saved : "dark";
          } catch {
            return "dark";
          }
        };

        const resolveTheme = (theme) =>
          theme === "auto" ? getSystemTheme() : theme;
        const actualTheme = resolveTheme(getSavedTheme());
        const current = document.documentElement.getAttribute("data-theme");

        // Only mutate if the value actually changes — avoids aborting an in-progress transition
        if (current !== actualTheme) {
          document.documentElement.setAttribute("data-theme", actualTheme);
        }

        // Stamp aria-pressed before first paint so CSS hides the active button immediately,
        // preventing layout shift caused by deferred JS toggling display:none after render.
        const savedTheme = getSavedTheme();
        document.addEventListener("DOMContentLoaded", function () {
          document
            .querySelectorAll("[data-theme-toggle]")
            .forEach(function (btn) {
              btn.setAttribute(
                "aria-pressed",
                btn.dataset.themeToggle === savedTheme ? "true" : "false",
              );
            });
        });
      })();
    </script>

    <!-- Preload critical stylesheets -->
    <link rel="preload" href="css/tokens.css" as="style" />
    <link rel="preload" href="css/reset.css" as="style" />
    <link rel="preload" href="css/color-themes.css" as="style" />
    <link rel="preload" href="css/base.css" as="style" />
    <link rel="preload" href="css/transition.css" as="style" />
    <link rel="preload" href="css/fonts.css" as="style" />
    <link rel="preload" href="css/theme-switcher.css" as="style" />

    <!-- Stylesheets -->
    <link rel="stylesheet" href="css/tokens.css" />
    <link rel="stylesheet" href="css/reset.css" />
    <link rel="stylesheet" href="css/color-themes.css" />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/transition.css" />
    <link rel="stylesheet" href="css/fonts.css" />
    <link rel="stylesheet" href="css/theme-switcher.css" />
    <link rel="stylesheet" href="css/index.css" />

    <!-- Favicons -->
    <link
      rel="icon"
      type="image/png"
      href="favicons/favicon-96x96.png"
      sizes="96x96"
    />
    <link rel="icon" type="image/svg+xml" href="favicons/favicon.svg" />
    <link rel="shortcut icon" href="favicons/favicon.ico" />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="favicons/apple-touch-icon.png"
    />
    <meta name="apple-mobile-web-app-title" content="raffaele.site" />
    <link rel="manifest" href="favicons/site.webmanifest" />
    <script
      src="https://cdn.jsdelivr.net/npm/gsap@3/dist/gsap.min.js"
      defer
    ></script>
    <script
      src="https://cdn.jsdelivr.net/npm/split-type@0/umd/index.min.js"
      defer
    ></script>
    <script
      src="https://unpkg.com/lenis@1.1.20/dist/lenis.min.js"
      defer
    ></script>
    <script src="js/nav.js" defer></script>
    <script src="js/main.js" defer></script>
    <script src="js/introgasp.js" defer></script>
  </head>

  <body data-page="index">
    <div class="wrapper">
      <!-- ✅ Browser support warnings - hidden by default via CSS @supports -->
      <div class="support view-transition" role="alert" aria-live="assertive">
        ⚠️ Your browser doesn't support View Transitions
      </div>
      <div class="support style-query" role="alert" aria-live="assertive">
        ⚠️ Your browser doesn't support Style Queries
      </div>

      <!-- ✅ header: labelledby ties header to its quote content -->
      <header aria-labelledby="site-quote">
        <p id="site-quote" class="header-text">
          "there will be an answer; Let It Be!"
        </p>
        <p class="header-break" aria-hidden="true">--the beatles</p>
      </header>
      <!-- ✅ main: labelledby ties main to visible h1 -->
      <main aria-labelledby="site-heading">
        <h1 id="site-heading" class="site-title">doin' business as:</h1>
        <div class="text-with-animation">
          <span>raffaele</span>&nbsp;<span>suppa</span>
        </div>
        <!-- <div class="subtext-with-animation">
          <span>with nothing</span>&nbsp;<span>up my sleeve</span>
        </div> -->
        <div class="subtext-with-animation-1">!</div>
        <!-- ✅ btn: labelledby ties button to its visible text -->
        <button
          class="btn"
          aria-labelledby="btn-label"
          aria-describedby="btn-description"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="24"
            height="24"
            viewBox="0 0 24 24"
            role="img"
            aria-labelledby="sneaker-icon-title"
          >
            <title id="sneaker-icon-title">Sneaker icon</title>
            <path
              fill="currentColor"
              d="M17.1 14.275L21.575 9.8l.725.725q.3.3.3.7t-.3.7L19.225 15q-.3.3-.712.288t-.713-.313zM1 17.35q0-.6.338-1.1t.912-.725q.525-.2 1-.475t.95-.625l1.45 1.45q.125.175.338.163t.362-.163q.125-.125.125-.337t-.125-.388l-1.375-1.375l.388-.387q.187-.188.387-.413L7.1 14.35q.125.175.338.175t.387-.175q.125-.125.125-.337t-.125-.388l-1.375-1.35q.125-.25.263-.512t.237-.563l1.625 1.625Q8.7 13 8.913 13t.387-.175q.125-.125.125-.325t-.125-.375L7.375 10.2l.875-2.425q.075-.2.2-.4t.275-.35l3.65-3.625q.575-.575 1.413-.562t1.412.587l5.65 5.65l-9.75 10.3q-.275.3-.65.463t-.8.162H3q-.825 0-1.412-.587T1 18zm8.625.65l8.425-8.875zM3 18h6.625l8.425-8.875l-4.275-4.275l-3.65 3.625L9.4 10.5l.75.75q.575.6.575 1.438T10.15 14.1l-2.825 2.825q-.6.6-1.425.6t-1.4-.6l-.2-.2q-.325.2-.65.35T3 17.35z"
            />
          </svg>
          <span class="button-text">
            <span id="btn-label">click the sneaker</span>
            <span id="btn-description">you can get off anywhere</span>
          </span>
        </button>
      </main>
      <!-- ✅ footer: labelledby ties footer to theme switcher legend -->
      <footer aria-label="Site settings">
        <!-- ✅ fieldset/legend is the correct pattern for grouped buttons -->
        <fieldset class="theme-switcher" aria-label="Theme switcher">
          <p class="footer-text">this is where the apple fell</p>
          <button
            data-theme-toggle="dark"
            aria-label="Switch to dark theme"
            aria-pressed="false"
          >
            <span class="visually-hidden">Dark theme</span>
            <svg
              xmlns="http://www.w3.org/2000/svg"
              viewBox="0 0 24 24"
              aria-hidden="true"
            >
              <path
                fill="currentColor"
                d="M12.075 21q-1.888 0-3.543-.713T5.64 18.336t-1.951-2.893t-.714-3.543q0-2.639 1.395-4.846t3.77-3.345q.177-.067.35-.058q.174.008.308.093q.123.079.197.238t.074.39q.108 2.09.925 3.963t2.295 3.351t3.353 2.295t3.968.925q.236 0 .386.068t.229.192q.085.134.099.313t-.053.35q-1.13 2.375-3.344 3.773T12.075 21m0-1q2.2 0 4.075-1.1t2.95-3.025q-2.15-.2-4.075-1.097t-3.45-2.422t-2.425-3.44T8.075 4.85Q6.15 5.925 5.063 7.813T3.975 11.9q0 3.375 2.363 5.738T12.075 20m2.071-12.97L12.99 5.874q-.243-.242-.243-.565q0-.324.243-.566l1.157-1.158q.243-.242.566-.242t.565.242l1.158 1.158q.242.242.242.566t-.242.565l-1.158 1.158q-.242.242-.565.242t-.566-.242m5.212 3.211l-.581-.561q-.165-.165-.165-.373t.165-.373l.58-.562q.166-.165.364-.165t.364.165l.561.562q.166.165.166.373t-.166.373l-.561.561q-.166.166-.364.166t-.363-.166"
              />
            </svg>
          </button>
          <button
            data-theme-toggle="auto"
            aria-label="Use my device color preference"
            aria-pressed="false"
          >
            <span class="visually-hidden">Use device color preference</span>
            <svg
              xmlns="http://www.w3.org/2000/svg"
              viewBox="0 0 24 24"
              aria-hidden="true"
            >
              <path
                fill="currentColor"
                d="M2.27 19.462q-.214 0-.358-.144t-.143-.356t.144-.357t.356-.144h19.462q.213 0 .356.144t.144.356t-.144.357t-.356.144zm2.346-2q-.691 0-1.153-.463T3 15.846V6.077q0-.69.463-1.153t1.152-.462h14.77q.69 0 1.152.462T21 6.077v9.77q0 .69-.463 1.152t-1.153.463zm0-1h14.769q.23 0 .423-.193t.192-.423V6.077q0-.23-.192-.423q-.193-.193-.424-.193H4.616q-.231 0-.424.193Q4 5.846 4 6.077v9.77q0 .23.192.422t.423.193m-.615 0v-11z"
              />
            </svg>
          </button>
        </fieldset>

        <!-- ✅ Live region announces theme changes to screen readers -->
        <div
          id="theme-announcement"
          class="visually-hidden"
          role="status"
          aria-live="polite"
          aria-atomic="true"
        ></div>
      </footer>
    </div>
  </body>
</html>
