<body data-page="index">
  <div class="wrapper">
    <!-- ✅ Browser support warnings - hidden by default via CSS @supports -->
    <div class="support view-transition" role="alert" aria-live="assertive">
      ⚠️ Your browser doesn't support View Transitions
    </div>
    <div class="support style-query" role="alert" aria-live="assertive">
      ⚠️ Your browser doesn't support Style Queries
    </div>
    <!-- ✅ header: labelledby ties header to its quote content -->
    <header aria-labelledby="site-quote">
      <a class="skip-link" href="#main-content">Skip to main content</a>
      <p id="site-quote" class="header-text">
        "there will be an answer;&nbsp;&nbsp;Let It Be!"
      </p>
      <p class="header-break" aria-hidden="true">--the beatles</p>
    </header>
    <main id="main-content" aria-labelledby="site-heading" tabindex="-1">
      <h2 id="site-heading" class="text-with-animation-1">
        <span>how</span>&nbsp;<span>it</span>&nbsp;<span>started</span>
      </h2>
      <h2 class="text-with-animation-2">
        <span>how</span>&nbsp;<span>it's</span>&nbsp;<span>going</span>
      </h2>
      <!-- ✅ CTA: a link styled as a button keeps the page navigation semantics and still supports the shared particle interaction -->
      <a class="btn" href="index-intro.html" aria-labelledby="btn-label" aria-describedby="btn-description">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 64 64" role="img"
          aria-labelledby="sneaker-icon-title">
          <title id="sneaker-icon-title">Sneaker icon</title>
          <!-- Icon downloaded from https://icon-sets.iconify.design/emojione/bellhop-bell/ -->
          <path fill="#3e4347"
            d="M53.6 51.5c-1.4-.8-3.3-4.7-3.3-4.7H13.6s-1.8 4-3.3 4.7c-1.9 1-5.4 2-5.4 5.7V62h54v-4.8c.1-3.7-3.4-4.7-5.3-5.7" />
          <path fill="#62696d"
            d="M55.4 57.9c0 1.1-.8 2-1.8 2H10.4c-1 0-1.8-.9-1.8-2s.8-2 1.8-2h43.2c1 0 1.8.9 1.8 2" />
          <path fill="#b2c1c0" d="M57 49.8v-3.1c0-14-11.2-22.4-25-22.4S7 32.7 7 46.7v3.1z" />
          <path fill="#dae3ea" d="M53.2 49.8v-2.9c0-13.6-9.5-21.5-21.2-21.5s-21.2 8-21.2 21.5v2.9z" />
          <path fill="#94989b" d="M26.8 10.1h10.5v4.1H26.8zm3.3 4.1h3.7v6.1h-3.7z" />
          <path fill="#3e4347" d="M30.1 14.2h3.7v3.1h-3.7z" />
          <path fill="#b2c1c0" d="M26 19.8h12v6.1H26z" />
          <path fill="#dae3ea" d="M28 19.8h8v6.7h-8z" />
          <path fill="#42ade2"
            d="m51.1 2l-8.9 14.8L56.7 6.4zM12.9 2l8.9 14.8L7.3 6.4zM48 22.8l11.5-6l2.5 6zm-32 0l-11.5-6l-2.5 6z" />
        </svg>
        <span class="button-text">
          <span class="btn-label" id="btn-label">ring the bell</span>
          <span class="btn-description" id="btn-description">!</span>
        </span>
      </a>
    </main>
    <!-- ✅ footer: labelledby ties footer to theme switcher legend -->
    <footer role="contentinfo" class="footer">
      <div class="theme-selector-container">
        <label id="theme-selector-label" for="theme-selector">color theme:</label>
        <div class="theme-selector" data-theme-selector>
          <button type="button" class="theme-selector-trigger" data-theme-selector-trigger aria-haspopup="listbox"
            aria-expanded="false" aria-controls="theme-selector-menu"
            aria-labelledby="theme-selector-label theme-selector-value">
            <span class="theme-selector-trigger-icon" aria-hidden="true">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
                <path fill="currentColor"
                  d="M230.72 145.06a4 4 0 0 0-4-1A92.08 92.08 0 0 1 111.94 29.27a4 4 0 0 0-5-5a100.78 100.78 0 0 0-50.86 35.61a100 100 0 0 0 140 140a100.78 100.78 0 0 0 35.59-50.87a4 4 0 0 0-.95-3.95m-39.42 48.47A92 92 0 0 1 62.47 64.7a93 93 0 0 1 39.88-30.35a100.09 100.09 0 0 0 119.3 119.3a93 93 0 0 1-30.35 39.88" />
              </svg>
            </span>
            <span id="theme-selector-value" class="theme-selector-trigger-text">dark</span>
            <span class="theme-selector-chevron" aria-hidden="true">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                <polyline points="6 9 12 15 18 9" fill="none" stroke="currentColor" stroke-width="1.8"
                  stroke-linecap="round" stroke-linejoin="round" />
              </svg>
            </span>
          </button>
          <ul id="theme-selector-menu" class="theme-selector-menu" data-theme-selector-menu role="listbox"
            aria-label="Color theme options" hidden>
            <li role="presentation">
              <button type="button" class="theme-selector-option" data-theme-option="light" role="option"
                aria-selected="false">
                <span class="theme-option-icon" aria-hidden="true">
                  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                    <path fill="currentColor"
                      d="m6.05 4.14l-.39-.39a.993.993 0 0 0-1.4 0l-.01.01a.984.984 0 0 0 0 1.4l.39.39c.39.39 1.01.39 1.4 0l.01-.01a.984.984 0 0 0 0-1.4M3.01 10.5H1.99c-.55 0-.99.44-.99.99v.01c0 .55.44.99.99.99H3c.56.01 1-.43 1-.98v-.01c0-.56-.44-1-.99-1m9-9.95H12c-.56 0-1 .44-1 .99v.96c0 .55.44.99.99.99H12c.56.01 1-.43 1-.98v-.97c0-.55-.44-.99-.99-.99m7.74 3.21c-.39-.39-1.02-.39-1.41-.01l-.39.39a.984.984 0 0 0 0 1.4l.01.01c.39.39 1.02.39 1.4 0l.39-.39a.984.984 0 0 0 0-1.4m-1.81 15.1l.39.39a.996.996 0 1 0 1.41-1.41l-.39-.39a.993.993 0 0 0-1.4 0c-.4.4-.4 1.02-.01 1.41M20 11.49v.01c0 .55.44.99.99.99H22c.55 0 .99-.44.99-.99v-.01c0-.55-.44-.99-.99-.99h-1.01c-.55 0-.99.44-.99.99M12 5.5c-3.31 0-6 2.69-6 6s2.69 6 6 6s6-2.69 6-6s-2.69-6-6-6m-.01 16.95H12c.55 0 .99-.44.99-.99v-.96c0-.55-.44-.99-.99-.99h-.01c-.55 0-.99.44-.99.99v.96c0 .55.44.99.99.99m-7.74-3.21c.39.39 1.02.39 1.41 0l.39-.39a.993.993 0 0 0 0-1.4l-.01-.01a.996.996 0 0 0-1.41 0l-.39.39c-.38.4-.38 1.02.01 1.41" />
                  </svg>
                </span>
                <span class="theme-option-label">light</span>
              </button>
            </li>
            <li role="presentation">
              <button type="button" class="theme-selector-option" data-theme-option="dark" role="option"
                aria-selected="true">
                <span class="theme-option-icon" aria-hidden="true">
                  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
                    <path fill="currentColor"
                      d="M230.72 145.06a4 4 0 0 0-4-1A92.08 92.08 0 0 1 111.94 29.27a4 4 0 0 0-5-5a100.78 100.78 0 0 0-50.86 35.61a100 100 0 0 0 140 140a100.78 100.78 0 0 0 35.59-50.87a4 4 0 0 0-.95-3.95m-39.42 48.47A92 92 0 0 1 62.47 64.7a93 93 0 0 1 39.88-30.35a100.09 100.09 0 0 0 119.3 119.3a93 93 0 0 1-30.35 39.88" />
                  </svg>
                </span>
                <span class="theme-option-label">dark</span>
              </button>
            </li>
            <li role="presentation">
              <button type="button" class="theme-selector-option" data-theme-option="system" role="option"
                aria-selected="false">
                <span class="theme-option-icon" aria-hidden="true">
                  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2048 2048">
                    <path fill="currentColor"
                      d="M2000 1525q12 12 21 29t15 36t9 38t3 36q0 27-10 50t-27 40t-41 28t-50 10H128q-27 0-50-10t-40-27t-28-41t-10-50q0-16 3-35t9-39t15-36t21-29l208-208V384h1536v933zM384 1280h1280V512H384zm1536 384q0-11-4-28t-12-26l-203-202H347l-203 202q-8 8-12 25t-4 29z" />
                  </svg>
                </span>
                <span class="theme-option-label">system (auto)</span>
              </button>
            </li>
          </ul>
        </div>
        <select id="theme-selector" name="theme" class="theme-selector-native" aria-label="Select color theme">
          <option value="light">light</option>
          <option value="dark" selected>dark</option>
          <option value="system">system (auto)</option>
        </select>
      </div>
      <div id="theme-announcement" class="visually-hidden" role="status" aria-live="polite" aria-atomic="true"></div>
    </footer>
  </div>
</body>

</html>
